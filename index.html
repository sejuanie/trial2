    <title>Musubi</title>

    <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@160..700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

    <style>
      :root {
        --color-gray-200: #414040;
        background-color: var(--color-white);
        --font-main: 'Readex Pro', sans-serif;
        --font-secondary: 'Ruwudu', sans-serif;
      }
    </style>

</head>

<!-- FIRST PAGE -->
<body id="login" class="w-screen overflow-x-hidden scroll-smooth">
        <section class="h-screen w-full flex flex-col justify-center items-center bg-cover bg-center" 
         style="background-image: url('photos/login-bg.png'); font-family: var(--font-main);">
    
        <img src="photos/logo.png" alt="Musubi Logo" class="mx-auto mb-0 w-62 h-60">

    <a href="#menu" class="bg-yellow-600 hover:bg-yellow-800 transform transition duration-300 hover:scale-110 text-white tracking-[0.15em] text-xl text-shadow-md py-2 px-11 rounded-full mt-10 mx-auto w-fit transition-all">
        DIG IN
    </a>

    <h3 class="absolute bottom-10 left-1/2 -translate-x-1/2 text-center text-amber-800 tracking-[0.25em] text-lg" style="font-family: var(--font-secondary);">
    The Art of Onigiri, Perfected for Your Taste
    </h3>
</section>
<!-- END -->

<!-- SECOND PAGE -->
<!-- navigation -->
<section id="menu" class="w-screen overflow-x-hidden scroll-smooth" style="font-family: var(--font-secondary); color: var(--color-gray-200);">
    <header class="relative w-full h-full overflow-hidden">
    <img src="photos/header.png" alt="Onigiri" class="absolute inset-0 h-full w-full object-cover"/>
    <div class="absolute inset-0 bg-gradient-to-t from-white via-white/20 to-transparent">
    </div>
    <nav class="relative z-10 flex flex-col md:flex-row items-center justify-between px-6 md:px-16 pt-4"> 
    <img src="photos/logo.png" alt="Logo" class="w-24 h-auto md:w-38 md:h-36 mb-6 md:mb-10">
    
    <ul class="flex flex-wrap justify-center items-center gap-2 md:gap-10 text-lg md:text-2xl font-semibold">
        <li>
            <a href="#foodmenu" class="inline-flex items-center justify-center pt-3 pb-3 px-6 md:px-9 rounded-full transition-all duration-300 ease-in-out hover:pt-6 hover:pb-2 hover:bg-[#ABA07F] hover:text-white hover:-translate-y-5">
                MENU
            </a>
        </li>
        <li>
            <a href="#ambience" class="inline-flex items-center justify-center pt-3 pb-3 px-6 md:px-9 rounded-full transition-all duration-300 ease-in-out hover:pt-6 hover:pb-2 hover:bg-[#ABA07F] hover:text-white hover:-translate-y-5">
                AMBIENCE
            </a>
        </li>
        <li>
            <a href="#reserve" class="inline-flex items-center justify-center pt-3 pb-3 px-6 md:px-9 rounded-full transition-all duration-300 ease-in-out hover:pt-6 hover:pb-2 hover:bg-[#ABA07F] hover:text-white hover:-translate-y-5">
                RESERVATIONS
            </a>
        </li>
    </ul>
</nav>
    </header>

<!-- actual menu -->
    <main class="bg-white min-h-screen p-10">
        <section id="foodmenu">
            <h2 class="text-2xl text-stone-800">Our Menu</h2>
            <p class="mt-4 text-stone-600">Content starts here on a solid white background...</p>
        </section>
    </main>
        </nav>
</section>

</header>
<!-- END -->
